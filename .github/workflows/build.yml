name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================
  # 快速检查：只编 Kotlin（不打包、不 dex）
  #
  # 为什么单独拎出来：完整构建要跑 AAPT2 / D8 / 打包签名，三分钟起步；
  # 而绝大多数红都是 Kotlin 编译错 —— 这一步通常 40~60 秒就有结果。
  # 下面 build 依赖它，编不过就不往打包那步走了。
  # ============================================================
  quickcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: 装 NDK（终端要 forkpty）
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          NDK_DIR="$SDK/ndk/27.0.12077973"

          # ⚠️ GitHub 镜像（20260927 那版）里预装了一个**残废的 NDK**：
          # 目录在、但少了 source.properties。而 sdkmanager 看到目录已存在就
          # 直接跳过不修 —— 于是 Gradle 配置阶段就报
          #   [CXX1101] NDK at ... did not have a source.properties file
          # 所以先手动把这个坏目录清掉，再装一次。
          if [ -d "$NDK_DIR" ] && [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "发现残废的 NDK 目录，删掉重装"
            rm -rf "$NDK_DIR"
          fi

          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "ndk;27.0.12077973" > /dev/null 2>&1 || echo "sdkmanager 装 NDK 没成功"
          fi

          if [ -f "$NDK_DIR/source.properties" ]; then
            echo "✅ NDK 就绪：$NDK_DIR"
          else
            echo "::error::NDK 还是不可用，看看镜像里都有啥："
            ls "$SDK/ndk" 2>/dev/null || true
            exit 1
          fi

      - name: Kotlin 编译检查（快速）
        run: gradle compileReleaseKotlin --no-daemon

  build:
    needs: quickcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: 装 NDK（终端要 forkpty）
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK=$SDK"
          NDK_DIR="$SDK/ndk/27.0.12077973"
          if [ -d "$NDK_DIR" ] && [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "发现残废的 NDK 目录，删掉重装"
            rm -rf "$NDK_DIR"
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" --install "ndk;27.0.12077973" > /dev/null 2>&1 || echo "sdkmanager 装 NDK 没成功"
          fi
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            echo "::error::NDK 还是不可用"
            ls "$SDK/ndk" 2>/dev/null || true
            exit 1
          fi

      # 只出 release 版（带日志的 debug 版不再推送）
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "版本号: $VERSION"
          cp app/build/outputs/apk/release/*.apk "out/nakour-${VERSION}.apk"
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nakour-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          name: Nakour ${{ github.ref_name }}  (${{ github.sha }})
          generate_release_notes: true
